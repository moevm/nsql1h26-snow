<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Симуляции — Уборка снега СПб</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app-header"></div>
    <div id="toast-container"></div>
    <div class="page-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2>Симуляции</h2>
            <a href="/static/index.html" class="btn btn-blue" style="padding:6px 14px;background:var(--blue);color:var(--bg);font-weight:600;border-radius:8px;text-decoration:none;font-size:0.85rem">+ Запустить на карте</a>
        </div>

        <div class="filter-section">
            <label>Название: <input id="f-name" type="text" placeholder="Поиск по названию" style="width:200px" /></label>
            <div class="filter-row">
                <label>Статус:
                    <select id="f-status">
                        <option value="">Все статусы</option>
                        <option value="running">Запущена</option>
                        <option value="paused">Пауза</option>
                        <option value="finished">Завершена</option>
                        <option value="idle">Ожидание</option>
                        <option value="error">Ошибка</option>
                    </select>
                </label>
                <label>Техника от: <input id="f-veh-min" type="number" placeholder="0" /></label>
                <label>до: <input id="f-veh-max" type="number" placeholder="999" /></label>
            </div>
            <div class="filter-row">
                <label>Создан от: <input id="f-date-from" type="date" /></label>
                <label>до: <input id="f-date-to" type="date" /></label>
            </div>
            <div class="filter-row">
                <button id="btn-filter" class="btn-blue">Применить фильтр</button>
                <button id="btn-reset">Сброс</button>
                <span id="result-count" style="color:var(--text-dim);font-size:0.85rem;"></span>
            </div>
        </div>

        <div id="loading" class="loading-indicator">Загрузка...</div>

        <table class="data-table" id="sims-table" style="display:none">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Статус</th>
                    <th>Тик</th>
                    <th>Время</th>
                    <th>Убрано (%)</th>
                    <th>Техника</th>
                    <th>Улиц</th>
                    <th>Создан</th>
                    <th>Начало</th>
                    <th>Конец</th>
                    <th>Карта</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="sims-tbody"></tbody>
        </table>

        <div class="pagination" id="pagination"></div>
        <div id="empty-state" class="empty-state" style="display:none">
            Симуляции не найдены. Запустите на <a href="/static/index.html">странице карты</a>.
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/simulations-page.js"></script>
</body>
</html>
