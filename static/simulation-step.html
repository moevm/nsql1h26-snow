<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шаг симуляции — Уборка снега СПб</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app-header"></div>
    <div id="toast-container"></div>
    <div class="page-content">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
                <a id="back-to-sim" href="/static/simulations.html" class="back-link">&larr; К симуляциям</a>
                <h2 id="step-title">Загрузка...</h2>
            </div>
            <div class="btn-group">
                <button id="btn-edit" class="btn-blue">Редактировать</button>
                <button id="btn-delete" class="btn-red">Удалить</button>
            </div>
        </div>

        <div id="step-map" class="detail-map"></div>

        <div class="detail-grid">
            <div class="detail-card" id="view-card">
                <h3>Статистика шага</h3>
                <div id="step-attrs"></div>
            </div>
            <div class="detail-card" id="edit-card" style="display:none">
                <h3>Редактирование</h3>
                <div class="form-row"><label>% дорог: <input id="e-roads" type="number" step="0.01" /></label></div>
                <div class="form-row"><label>Снег (м³): <input id="e-snow" type="number" step="0.1" /></label></div>
                <div class="form-row"><label>Топливо (л): <input id="e-fuel" type="number" step="0.1" /></label></div>
                <div class="form-row"><label>Поломки: <input id="e-breaks" type="number" /></label></div>
                <div class="btn-group">
                    <button id="btn-save" class="btn-green">Сохранить</button>
                    <button id="btn-cancel">Отмена</button>
                </div>
            </div>
        </div>

        <div class="detail-card" style="margin-bottom:16px">
            <h3>Машины на этом шаге</h3>
            <table class="data-table" id="vehicles-table">
                <thead><tr><th>#</th><th>ID</th><th>Тип</th><th>Статус</th><th>Топливо</th><th>Вместимость</th><th>Скорость</th><th>Цель</th><th>Прогресс</th><th>Дорога</th></tr></thead>
                <tbody id="vehicles-tbody"></tbody>
            </table>
            <div id="vehicles-empty" class="empty-state" style="display:none">Нет данных о машинах</div>
        </div>

        <div class="detail-card" id="sim-state-card" style="margin-bottom:16px;display:none">
            <h3>События шага (sim_state)</h3>
            <div id="sim-state-aggregates" style="margin-bottom:12px"></div>
            <table class="data-table" id="events-table">
                <thead><tr><th>Агент</th><th>Событие</th><th>Статус</th><th>Цель</th><th>Дорога</th></tr></thead>
                <tbody id="events-tbody"></tbody>
            </table>
            <div id="events-empty" class="empty-state" style="display:none">Нет событий</div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/simulation-step-detail.js"></script>
</body>
</html>
