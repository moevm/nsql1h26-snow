<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пользователи — Уборка снега СПб</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app-header"></div>
    <div id="toast-container"></div>
    <div class="page-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2>Пользователи</h2>
            <button id="btn-create" class="btn-green">+ Добавить</button>
        </div>

        <div class="filter-section">
            <div class="filter-row">
                <label>ID: <input id="f-id" type="text" /></label>
                <label>Имя: <input id="f-name" type="text"  /></label>
                <label>Роль:
                    <select id="f-role">
                        <option value="">Все</option>
                        <option value="operator">operator</option>
                        <option value="admin">admin</option>
                    </select>
                </label>
            </div>
            <div class="filter-row">
                <label>Создан от: <input id="f-created-from" type="datetime-local" /></label>
                <label>до: <input id="f-created-to" type="datetime-local" /></label>
                <label>Изменён от: <input id="f-upd-from" type="datetime-local" /></label>
                <label>до: <input id="f-upd-to" type="datetime-local" /></label>
            </div>
            <div class="filter-row">
                <button id="btn-filter" class="btn-blue">Применить</button>
                <button id="btn-stats" class="btn-blue">Статистика</button>
                <button id="btn-reset">Сброс</button>
                <span id="result-count" style="color:var(--text-dim);font-size:0.85rem;"></span>
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
        <div id="loading" class="loading-indicator">Загрузка...</div>

        <div id="users-table-wrapper" style="overflow-x:auto;width:100%">
        <table class="data-table" id="users-table" style="display:none;min-width:max-content">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Роль</th>
                    <th>Создан</th>
                    <th>Изменён</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
        </table>
        </div>

        <div id="empty-state" class="empty-state" style="display:none">Пользователи не найдены.</div>
    </div>

    <div id="modal-create" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3>Добавить пользователя</h3>
            <div class="form-row"><label>Имя: <input id="c-name" type="text" required /></label></div>
            <div class="form-row"><label>Роль: <select id="c-role"><option value="operator">operator</option><option value="admin">admin</option></select></label></div>
            <div class="form-row"><label>Пароль: <input id="c-password" type="password" required /></label></div>
            <div class="btn-group">
                <button id="btn-save-create" class="btn-green">Сохранить</button>
                <button id="btn-cancel-create">Отмена</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/pagination.js"></script>
    <script src="/static/js/table-stats.js"></script>
    <script src="/static/js/users-page.js"></script>
</body>
</html>
