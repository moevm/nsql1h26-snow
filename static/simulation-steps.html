<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шаги симуляции — Уборка снега СПб</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app-header"></div>
    <div id="toast-container"></div>
    <div class="page-content">
        <h2>Шаги симуляции</h2>
        <div class="filter-section">
            <div class="filter-row">
                <label>ID симуляции: <input id="f-sim-id" type="text" /></label>
                <label>Тик от: <input id="f-tick-min" type="number" /></label>
                <label>до: <input id="f-tick-max" type="number" /></label>
                <button id="btn-filter" class="btn-blue">Найти</button>
                <button id="btn-reset">Сброс</button>
                <span id="result-count" style="color:var(--text-dim);font-size:0.85rem;"></span>
            </div>
        </div>
        <div id="loading" class="loading-indicator" style="display:none">Загрузка...</div>
        <table class="data-table" id="steps-table" style="display:none">
            <thead><tr>
                <th>ID</th><th>Тик</th><th>% дорог</th><th>Снег (м³)</th><th>Топливо (л)</th><th>Поломки</th><th>Время</th>
            </tr></thead>
            <tbody id="steps-tbody"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
        <div id="empty-state" class="empty-state" style="display:none">Шаги не найдены</div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/simulation-steps-page.js"></script>
</body>
</html>
