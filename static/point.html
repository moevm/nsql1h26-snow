<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Точка — Уборка снега СПб</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app-header"></div>
    <div id="toast-container"></div>
    <div class="page-content">
        <a href="/static/points.html" class="back-link">&larr; Назад к точкам</a>
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h2 id="point-title">Загрузка...</h2>
            <div class="btn-group">
                <button id="btn-edit" class="btn-blue">Редактировать</button>
                <button id="btn-delete" class="btn-red">Удалить</button>
            </div>
        </div>

        <div id="point-map" class="detail-map"></div>

        <div class="detail-grid">
            <div class="detail-card" id="view-card">
                <h3>Атрибуты</h3>
                <div id="point-attrs"></div>
            </div>
            <div class="detail-card" id="edit-card" style="display:none">
                <h3>Редактирование</h3>
                <div class="form-row"><label>Название: <input id="e-name" type="text" /></label></div>
                <div class="form-row"><label>Тип:
                    <select id="e-type">
                        <option value="">— Без типа —</option>
                        <option value="parking">Парковка</option>
                        <option value="snow_polygon">Снегоплавильня</option>
                        <option value="service_station">Сервисная станция</option>
                    </select>
                </label></div>
                <div class="form-row"><label>Широта: <input id="e-lat" type="number" step="0.000001" /></label></div>
                <div class="form-row"><label>Долгота: <input id="e-lng" type="number" step="0.000001" /></label></div>
                <div class="form-row"><label>Вместимость: <input id="e-capacity" type="number" /></label></div>
                <div class="form-row"><label>Описание: <input id="e-desc" type="text" /></label></div>
                <div class="btn-group">
                    <button id="btn-save" class="btn-green">Сохранить</button>
                    <button id="btn-cancel-edit">Отмена</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/point-detail.js"></script>
</body>
</html>
