services:
  neo4j:
    image: neo4j:5
    container_name: snow-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  hello:
    image: python:3.12-slim
    container_name: snow-hello
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install --quiet -r requirements.txt && python hello.py"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
