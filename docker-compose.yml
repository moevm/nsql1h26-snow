x-app-base: &app-base
  build: .
  env_file: .env
  volumes:
    - neo4j_import:/neo4j_import
    - osm_data:/osm_data

services:
  osm-downloader:
    build:
      context: .
      dockerfile: Dockerfile.osm-downloader
    volumes:
      - osm_data:/osm_data
    environment:
      PBF_URL: https://download.geofabrik.de/russia/northwestern-fed-district-latest.osm.pbf
      BBOX: "30.2970,59.9665,30.3305,59.9805"
    restart: "no"

  db:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-snowcleaning2026}
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-snowcleaning2026}", "RETURN 1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  app:
    <<: *app-base
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://db:7687
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      GEOJSON_PATH: /osm_data/saint-petersburg.osm
    depends_on:
      osm-downloader:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j-migrations:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app","--host", "0.0.0.0", "--port", "8000"]
  neo4j-migrations:
    <<: *app-base
    environment:
      NEO4J_URI: bolt://db:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-snowcleaning2026}
      GEOJSON_PATH: /osm_data/saint-petersburg.osm
    depends_on:
      osm-downloader:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]

volumes:
  neo4j_data:
  neo4j_import:
  osm_data:
